# Two networks: "edge" (reachable from nginx) and "data" (databases only).
name: narsil

x-restart: &restart
  restart: unless-stopped

networks:
  edge:
  data:

volumes:
  pg_data:
  mysql_data:
  wp_data:

services:
  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    ports: ["80:80"]            # TLS: terminate with Cloudflare or add certbot later (see README)
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, core, wordpress]
    networks: [edge]

  web:
    <<: *restart
    build: ./web
    environment:
      CORE_INTERNAL_URL: http://core:8080
      WP_INTERNAL_URL: http://wordpress
    mem_limit: 512m
    networks: [edge]

  core:
    <<: *restart
    build: ./services
    environment:
      POSTGRES_DSN: postgres://narsil:${POSTGRES_PASSWORD}@postgres:5432/narsil?sslmode=disable
      MONGO_URI: mongodb://mongodb:27017
      REDIS_ADDR: redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      mongodb:  { condition: service_healthy }
      redis:    { condition: service_healthy }
    mem_limit: 256m
    networks: [edge, data]

  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: narsil
      POSTGRES_DB: narsil
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./services/core-service/migrations:/docker-entrypoint-initdb.d:ro  # runs on first boot only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narsil -d narsil"]
      interval: 5s
      retries: 10
    mem_limit: 512m
    networks: [data]

  mongodb:
    image: mongo:7.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  wordpress:
    <<: *restart
    image: wordpress:6-apache
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      # Served under /blog-admin behind nginx (prefix is stripped by the proxy).
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${SITE_URL}/blog-admin');
        define('WP_SITEURL', '${SITE_URL}/blog-admin');
        if (($_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') { $_SERVER['HTTPS'] = 'on'; }
    volumes: [wp_data:/var/www/html]
    depends_on:
      mysql: { condition: service_healthy }
    mem_limit: 512m
    networks: [edge, data]

  mysql:
    <<: *restart
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 20
    mem_limit: 768m
    networks: [data]
